name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Stripe tests (no credentials)
        run: npm run test:stripe
      - name: Install Pi Genesis dependencies
        run: npm ci --ignore-scripts --prefix integrations/pi-genesis
      - name: Compile Pi Genesis
        run: npm run build --prefix integrations/pi-genesis
      - name: Pi Genesis tests (local EVM only)
        run: npm run test:pi
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Test
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
